name: Deploy SEC API

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # We must explicitly grant the automatic GitHub token permission to read code and write to the package registry
    permissions:
      contents: read
      packages: write 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # --- Convert GitHub username to lowercase ---
      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Use the new lowercase variable here!
          tags: ghcr.io/${{ env.OWNER_LC }}/secapi:latest

      - name: SSH into Droplet, Pull, and Restart Container
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          # Pass the standard GitHub variable here
          REPO_OWNER: ${{ github.repository_owner }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          # Ensure REPO_OWNER is in the envs list
          envs: GH_TOKEN,GH_USER,REPO_OWNER,DB_PASSWORD,DEEPSEEK_API_KEY
          script: |
            # Convert the repository owner to lowercase directly on the Droplet
            LOWERCASE_OWNER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
            IMAGE_NAME="ghcr.io/$LOWERCASE_OWNER/secapi:latest"
            
            echo "Attempting to pull and run image: $IMAGE_NAME"

            # 1. Log in to GHCR
            echo $GH_TOKEN | docker login ghcr.io -u $GH_USER --password-stdin
            
            # 2. Pull the latest image
            docker pull $IMAGE_NAME
            
            # 3. Stop and remove the existing container
            docker stop secapi_container || true
            docker rm secapi_container || true
            
            # 4. Run the new container
            docker run -d \
              --name secapi_container \
              --restart always \
              --network=network-a \
              -p 8000:8000 \
              --memory="1g" \
              --memory-swap="1.5g" \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              -e DB_HOST=sec-database \
              -e DB_PASSWORD=$DB_PASSWORD \
              -e DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY \
              -e DB_NAME=sec \
              -e CORS_ORIGINS=http://159.203.94.47:5000 \
              $IMAGE_NAME
            
            # 5. Clean up old unused images
            docker image prune -f